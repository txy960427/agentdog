# 0.8B语言部分全参SFT；在GPU机器从项目根目录通过run.sh启动。
model_name_or_path: Qwen/Qwen3.5-0.8B
trust_remote_code: false
use_fast_tokenizer: true
flash_attn: sdpa
enable_liger_kernel: false

stage: sft
do_train: true
do_eval: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false

dataset_dir: data/agentdog/1.5/coarse-grained/sft/step4/final
dataset: agentdog_train
eval_dataset: agentdog_validation
val_size: 0.0
template: qwen3_5
enable_thinking: false
default_system: ""
train_on_prompt: false
mask_history: false
packing: false
# 当前官方tokenizer对照值；run.py仍按实际GPU环境重检并覆盖，长度不足时停止。
cutoff_len: 10496
preprocessing_num_workers: 1
dataloader_num_workers: 2
overwrite_cache: true

# 学习率沿用论文公开值；epoch/batch/warmup为本次工程起跑配置。
learning_rate: 1.0e-5
num_train_epochs: 3.0
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
disable_gradient_checkpointing: false
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
optim: adamw_torch
bf16: true
seed: 42
data_seed: 42
group_by_length: true

# 只算验证loss，避免保存整段词表logits；benchmark继续使用judge_eval。
prediction_loss_only: true
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
logging_steps: 1
report_to: none
save_only_model: false
save_safetensors: true
resume_from_checkpoint: null
plot_loss: true
# 实际输出由入口改为本次runs/<时间>/model。
output_dir: train/agentdog/1.5/coarse-grained/sft/runs/manual/model
overwrite_output_dir: false
